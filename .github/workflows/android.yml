name: Android verification without uploads

on:
  push:
    branches: ["arena/d9e25272-tama-v2"]

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  android-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache-jdk: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}
      - name: Build required native dependencies locally
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH"
          bash scripts/android/build-natives.sh
      # Optional private test signer. No key or APK is uploaded or cached.
      - name: Prepare optional private test signer
        env:
          TEST_STORE: ${{ secrets.TAMA_TEST_KEYSTORE_BASE64 }}
          TEST_STORE_PASSWORD: ${{ secrets.TAMA_TEST_STORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TAMA_TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TAMA_TEST_KEY_PASSWORD }}
        run: |
          if [ -z "$TEST_STORE$TEST_STORE_PASSWORD$TEST_KEY_ALIAS$TEST_KEY_PASSWORD" ]; then
            echo '::warning::No stable test signer configured; this build uses a temporary debug key.'
            exit 0
          fi
          if [ -z "$TEST_STORE" ] || [ -z "$TEST_STORE_PASSWORD" ] || [ -z "$TEST_KEY_ALIAS" ] || [ -z "$TEST_KEY_PASSWORD" ]; then
            echo '::error::Incomplete private test signing settings.'
            exit 1
          fi
          umask 077
          printf '%s' "$TEST_STORE" | base64 --decode > "$RUNNER_TEMP/tama-test-signing.jks"
      # Separate Gradle processes prevent two variant compilers sharing the same heap.
      - name: Assemble parallel test locally
        working-directory: android/src/android
        env:
          TAMA_TEST_STORE_PASSWORD: ${{ secrets.TAMA_TEST_STORE_PASSWORD }}
          TAMA_TEST_KEY_ALIAS: ${{ secrets.TAMA_TEST_KEY_ALIAS }}
          TAMA_TEST_KEY_PASSWORD: ${{ secrets.TAMA_TEST_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/tama-test-signing.jks" ]; then export TAMA_TEST_KEYSTORE_FILE="$RUNNER_TEMP/tama-test-signing.jks"; fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleTamaTest --max-workers=1 --console=plain --no-daemon \
            '-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
      - name: Assemble normal debug locally for identity check
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --max-workers=1 --console=plain --no-daemon \
            '-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
      - name: Run parallel history tests
        working-directory: android/src/android
        env:
          TAMA_TEST_STORE_PASSWORD: ${{ secrets.TAMA_TEST_STORE_PASSWORD }}
          TAMA_TEST_KEY_ALIAS: ${{ secrets.TAMA_TEST_KEY_ALIAS }}
          TAMA_TEST_KEY_PASSWORD: ${{ secrets.TAMA_TEST_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/tama-test-signing.jks" ]; then export TAMA_TEST_KEYSTORE_FILE="$RUNNER_TEMP/tama-test-signing.jks"; fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testTamaTestUnitTest \
            --tests 'ai.tama.net.GroqHistoryPolicyTest' \
            --tests 'ai.tama.net.GroqHistoryWireTest' \
            --tests 'ai.tama.net.ProviderHistoryInteroperabilityTest' \
            --tests 'ai.tama.net.AutomaticFailureWireTest' \
            --tests 'ai.tama.router.ModelRouteHistoryTest' \
            --tests 'ai.tama.router.AutoFailureSimulationTest' \
            --tests 'ai.tama.router.AutoModelFailureTest' \
            --tests 'ai.tama.router.ModelRouterTest' \
            --tests 'ai.tama.router.ImageRetryOfferTest' \
            --tests 'ai.tama.router.LargerContextTest' \
            --tests 'ai.tama.router.AutomaticCostGuardTest' \
            --tests 'ai.tama.pricing.FreeModelImportTest' \
            --tests 'ai.tama.pricing.OpenRouterPricingTest' \
            --tests 'ai.tama.media.ImageToolPresentationTest' \
            --tests 'ai.tama.media.ImageRawToolFilterTest' \
            --tests 'ai.tama.providers.ProviderEndpointsTest' \
            --max-workers=1 --console=plain --no-daemon \
            '-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
      - name: Run normal debug isolation tests
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest \
            --tests 'ai.tama.net.GroqHistoryPolicyTest' \
            --tests 'ai.tama.net.GroqNormalHistoryWireTest' \
            --tests 'ai.tama.router.ModelRouteHistoryTest' \
            --tests 'ai.tama.providers.ProviderEndpointsTest' \
            --max-workers=1 --console=plain --no-daemon \
            '-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
      - name: Verify separate APK identities locally
        run: |
          python3 scripts/android/verify-parallel-apk.py \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --apk android/src/android/app/build/outputs/apk/tamaTest/app-tamaTest.apk \
            --normal-apk android/src/android/app/build/outputs/apk/debug/app-debug.apk \
            --out-dir /tmp/tama-identity-check
      - name: Remove private test signer
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/tama-test-signing.jks"
