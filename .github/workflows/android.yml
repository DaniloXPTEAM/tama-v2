name: TAMA V2 Android build diagnosis

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: read
  contents: read

jobs:
  diagnose-previous-run:
    if: github.event.pull_request.number == 1 && github.head_ref == 'arena/4f0fb56f-tamaaiv2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Extract a sanitized cause from the failed Android build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 59c4bd0a713cdb2e153dfcec6ec3ec5fa94d0174
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          parent=$(gh api "repos/DaniloXPTEAM/tamaaiv2/commits/$HEAD_SHA" --jq '.parents[0].sha')
          test "$parent" = "$EXPECTED_PARENT"
          log="$RUNNER_TEMP/failed-android-job.log"
          if ! gh run view 44224318846 --repo DaniloXPTEAM/tamaaiv2 --log-failed >"$log" 2>"$RUNNER_TEMP/log-error"; then
            echo '::error title=Android diagnosis::Could not retrieve the previous job log using the runner token.'
            exit 1
          fi
          python3 - "$log" <<'PY'
          import re, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          lines = []
          for line in raw:
              line = line.split('\t')[-1]
              line = re.sub(r'^\d{4}-\d{2}-\d{2}T\S+\s*', '', line).strip()
              lines.append(line)
          positions = [i for i, line in enumerate(lines) if 'What went wrong:' in line]
          selected = []
          for start in positions[-2:]:
              for line in lines[start:start + 45]:
                  if line.startswith('* Try:') or line.startswith('* Get more help'): break
                  if line: selected.append(line)
          if not selected:
              selected = [line for line in lines if re.search(r'(?i)(BUILD FAILED|execution failed|could not resolve|caused by:|timed out|\berror:|\bfailure:)', line)][-20:]
          if not selected:
              selected = ['The build failed, but no concise cause could be extracted.']
          selected = selected[:50]
          clean = []
          for line in selected:
              line = re.sub(r'https?://[^\s]+', '[URL]', line)
              line = re.sub(r'(?i)\b(token|password|secret|authorization|api[_-]?key)\s*[:=]\s*\S+', r'\1=[redacted]', line)
              clean.append(line[:500])
          message = '\n'.join(clean)[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Android build cause::' + message)
          print('Sanitized diagnosis emitted as a check annotation; no artifacts uploaded.')
          PY
