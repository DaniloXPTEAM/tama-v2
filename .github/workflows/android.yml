name: Temporary removal of previously uploaded test APKs

# This one-off workflow only removes APK artifacts from this branch; it builds and uploads nothing.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  remove-apks:
    name: Remove previous branch APK artifacts
    if: github.ref == 'refs/heads/arena/4f0fb56f-tamaaiv2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete branch APK artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq \
            '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "arena/4f0fb56f-tamaaiv2") | select(.name == "tama-v2-parallel-test-apk" or .name == "tama-v2-parallel-diagnostic" or .name == "nanoMuse-debug-apk") | .id' \
            > /tmp/tama-apks-to-remove
          count=0
          while IFS= read -r id; do
            gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            count=$((count+1))
          done < /tmp/tama-apks-to-remove
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq \
            '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "arena/4f0fb56f-tamaaiv2") | select(.name == "tama-v2-parallel-test-apk" or .name == "tama-v2-parallel-diagnostic" or .name == "nanoMuse-debug-apk") | .id' \
            > /tmp/tama-apks-remaining
          remaining=$(wc -l < /tmp/tama-apks-remaining)
          echo "::notice title=TAMA_PRIVATE_CLEANUP::deleted=$count;remaining=$remaining"
          test "$remaining" -eq 0
