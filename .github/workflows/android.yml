name: TAMA V2 Kotlin compiler diagnosis

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: read
  contents: read

jobs:
  diagnose-compiler:
    if: github.event.pull_request.number == 1 && github.head_ref == 'arena/4f0fb56f-tamaaiv2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Extract sanitized Kotlin compiler errors
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 04554774245fb407a5d64b211d32477245ab6d09
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          parent=$(gh api "repos/DaniloXPTEAM/tamaaiv2/commits/$HEAD_SHA" --jq '.parents[0].sha')
          test "$parent" = "$EXPECTED_PARENT"
          if ! gh run view 44227188298 --repo DaniloXPTEAM/tamaaiv2 --log-failed >"$RUNNER_TEMP/kotlin.log" 2>/dev/null; then
            echo '::error title=Kotlin diagnosis::Previous job log could not be read.'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/kotlin.log" <<'PY'
          import re, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          lines = []
          for line in raw:
              line = line.split('\t')[-1]
              line = re.sub(r'^\d{4}-\d{2}-\d{2}T\S+\s*', '', line).strip()
              lines.append(line)
          pat = re.compile(r'(?i)(\be:\s|error:|exception|caused by:|outofmemory|kotlin\.backend|file being compiled|\.kt:\d+|internal compiler error|not enough memory|compilation failure|BUILD FAILED)')
          chosen = [line for line in lines if pat.search(line)][-100:]
          if not chosen: chosen = ['No compiler-specific lines could be extracted.']
          chunks = []
          for line in chosen:
              line = re.sub(r'https?://[^\s]+', '[URL]', line)
              line = re.sub(r'(?i)\b(token|password|secret|authorization|api[_-]?key)\s*[:=]\s*\S+', r'\1=[redacted]', line)
              chunks.append(line[:600])
          message = '\n'.join(chunks)[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Kotlin compiler details::' + message)
          PY
